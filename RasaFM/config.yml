version: "3.1"

language: en   # IMPORTANT: keep en, multilingual handled via pipeline

pipeline:
  # 1. TOKENIZATION (works for English + Amharic Unicode text)
- name: WhitespaceTokenizer

  # 2. BASIC TEXT FEATURES
- name: RegexFeaturizer

- name: LexicalSyntacticFeaturizer

  # 3. STRONG TYPO HANDLING (CRITICAL for medicine names)
- name: CountVectorsFeaturizer
  analyzer: char_wb
  min_ngram: 3
  max_ngram: 5

  # 5. INTENT + ENTITY MODEL (CORE BRAIN)
- name: DIETClassifier
  epochs: 200
  constrain_similarities: true

  # 6. NORMALIZE MEDICINE NAMES / SYNONYMS
- name: EntitySynonymMapper

  # 7. HANDLE UNKNOWN / NOISE INPUT
- name: FallbackClassifier
  threshold: 0.35
  ambiguity_threshold: 0.1
assistant_id: 20260512-152616-canary-reef
