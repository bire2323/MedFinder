version: "3.1"

language: en   # IMPORTANT: keep en, multilingual handled via pipeline and slots

pipeline:
- name: WhitespaceTokenizer

- name: RegexFeaturizer

- name: LexicalSyntacticFeaturizer

  # 3. STRONG TYPO HANDLING (CRITICAL for medicine names)
- name: CountVectorsFeaturizer
  analyzer: char_wb
  min_ngram: 3
  max_ngram: 5

  # 4. INTENT + ENTITY MODEL (CORE BRAIN)
- name: DIETClassifier
  epochs: 200
  constrain_similarities: true
  use_masked_lm: true  # Better multilingual support

  # 5. NORMALIZE MEDICINE NAMES / SYNONYMS
- name: EntitySynonymMapper

  # 6. HANDLE UNKNOWN / NOISE INPUT
  # FIXED: Increased threshold from 0.35 to 0.50 for more confident classification
- name: FallbackClassifier
  threshold: 0.50
  ambiguity_threshold: 0.10

assistant_id: 20260512-152616-canary-reef

policies:
# Default policies for Rasa 3.x
  - name: MemoizationPolicy
  
  - name: RulePolicy
    core_fallback_threshold: 0.30
    core_fallback_action_name: "action_default_fallback"
  
  - name: UnexpecTEDIntentPolicy
    max_history: 5
    epochs: 100
  
  - name: TEDPolicy
    max_history: 5
    epochs: 100
    constrain_similarities: true
