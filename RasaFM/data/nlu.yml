version: "3.1"
nlu:
- intent: greet
  examples: |
    - hi
    - hi how are you
- intent: search_drug
  examples: |
    - where can i get [panadol](drug_name)
    - i am looking for [panadol]{"entity": "drug_name", "value": "paracetamol"}
- intent: set_language
  examples: |
    - change language to [amharic]{"entity": "language", "value": "am"}
