version: "3.1"

stories:
  - story: happy path
    steps:
      - intent: greet
      - action: utter_greet
      - intent: mood_great
      - action: utter_happy

  - story: drug search path
    steps:
      - intent: search_drug
      - action: action_search_drugs
      - intent: affirm
      - action: utter_happy

  - story: sad path with recovery
    steps:
      - intent: greet
      - action: utter_greet
      - intent: mood_unhappy
      - action: utter_help  # Offer help instead of just asking if it helped
      - intent: search_pharmacy
      - action: action_search_pharmacy

  - story: user denies help
    steps:
      - intent: mood_unhappy
      - action: utter_did_that_help
      - intent: deny
      - action: utter_goodbye

  - story: interactive_story_1
    steps:
     - intent: greet
     - action: utter_greet
     - intent: ask_how_to_use_map
     - action: utter_map_usage
     - intent: ask_capabilities
       entities:
       - services: capability
     - action: utter_capabilities
     - intent: ask_capabilities
     - action: utter_capabilities
     - intent: ask_difference_chatbot_vs_app
     - action: utter_chatbot_advantage
     - intent: ask_difference_chatbot_vs_app
     - action: utter_chatbot_advantage
     - intent: ask_about_app
     - action: utter_about_app
     - intent: ask_developer_info
     - action: utter_developer_info
     - intent: search_drug
       entities:
       - drug_name: paracetamol
     - slot_was_set:
       - drug_name: paracetamol
     - action: action_search_drugs
