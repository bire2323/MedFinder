services:
  backend:
    build:
      context: ./backend
      dockerfile: ${BACKEND_DOCKERFILE:-Dockerfile}
    container_name: medfinder-backend
    # no ports exposed publicly
    volumes:
      - ./backend:/var/www/html
      - /var/www/html/vendor
    environment:
      APP_ENV: ${APP_ENV}
      APP_DEBUG: ${APP_DEBUG}
      APP_URL: ${APP_URL}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: ${REVERB_APP_ID}
      REVERB_APP_KEY: ${REVERB_APP_KEY}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET}
      REVERB_HOST: reverb
      REVERB_PORT: 6001
      REVERB_SCHEME: http
      SESSION_DRIVER: database
      SESSION_SAME_SITE: none
      SESSION_SECURE_COOKIE: "true"
      SANCTUM_STATEFUL_DOMAINS: "medfinder.com,localhost,127.0.0.1,*.ngrok-free.dev,*.ngrok.app,*.ngrok-free.app,*.ngrok.io"
      TRUSTED_PROXIES: "*"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
