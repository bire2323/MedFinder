services:
  - type: web
    name: medfinder-backend
    env: docker
    dockerfilePath: Dockerfile.render
    branch: main
    buildCommand: ""
    startCommand: ""
    releaseCommand: "php artisan migrate --force && php artisan config:cache"
    plan: free
    envVars:
      - key: APP_ENV
        value: production
      - key: PORT
        value: 8080
