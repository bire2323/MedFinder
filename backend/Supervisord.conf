[program:laravel]
command=/usr/sbin/apache2ctl -D FOREGROUND
autostart=true
autorestart=true

[program:reverb]
command=php artisan reverb:start --host=0.0.0.0 --port=8080
directory=/var/www/html
autostart=true
autorestart=true

[program:apache]
command=/usr/sbin/apache2ctl -D FOREGROUND
autostart=true
autorestart=true

