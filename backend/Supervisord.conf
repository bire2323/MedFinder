[supervisord]
nodaemon=true

[program:init]
directory=/var/www/html
command=sh -c "
    if [ ! -f /var/www/html/storage/migration-lock ]; then
        php artisan migrate --force --database=pgsql_direct &&
        touch /var/www/html/storage/migration-lock
    else
        echo 'Migrations already run, skipping.'
    fi &&
    php artisan config:cache && php artisan route:cache
"
autostart=true
autorestart=false
startsecs=0
priority=5
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr

[program:apache]
command=apache2-foreground
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:reverb]
directory=/var/www/html
command=php artisan reverb:start --host=0.0.0.0 --port=8080
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0